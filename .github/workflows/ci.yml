name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      # --fix is in the package script for local use; CI must not rewrite files
      # and call it green, so run eslint directly.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        run: npm run build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test -- --ci --runInBand

  e2e:
    name: e2e tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_db
        ports:
          - 5432:5432
        # Without the health check the job races the container and fails on a
        # cold runner roughly one run in five.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: payment_db
      JWT_SECRET: ci-secret-not-used-outside-ci
      CSRF_SECRET: ci-csrf-not-used-outside-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Run migrations
        run: npm run migration:run || echo "no migration script, relying on synchronize"

      - name: E2E
        run: npm run test:e2e -- --ci --runInBand

  contracts:
    name: contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      # The testnet profile is what actually ships. Building it here catches
      # optimizer-only failures that the default profile never sees.
      - name: Build testnet profile
        run: forge build --profile testnet
