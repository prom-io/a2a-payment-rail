name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      # --fix is in the package script for local use; CI must not rewrite files
      # and call it green, so run eslint directly.
      - name: Lint
        run: npx eslint "{src,test}/**/*.ts" --max-warnings 0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Build
        run: npm run build

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test -- --ci --runInBand
