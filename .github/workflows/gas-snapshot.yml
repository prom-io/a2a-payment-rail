name: gas-snapshot

on:
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/gas-snapshot.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      # правку самой проверки тоже надо прогонять, иначе её починку не увидеть
      - '.github/workflows/gas-snapshot.yml'

jobs:
  diff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build
        run: forge build --sizes

      # --check exits non-zero only when gas really moved past the tolerance.
      # The previous version used --diff, which prints a line for every test even
      # when nothing changed, and then treated a non-empty file as a regression,
      # so this job could never pass.
      - name: Compare gas snapshot
        run: |
          set -o pipefail
          forge snapshot --check .gas-snapshot --tolerance 1 | tee snapshot.diff

      - name: Explain the failure
        if: failure()
        run: echo "::error::Gas usage moved beyond the tolerance. Run 'forge snapshot' locally and commit the updated .gas-snapshot if the change is intentional."

      - name: Upload diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot-diff
          path: contracts/snapshot.diff
          if-no-files-found: ignore
